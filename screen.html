<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132840">
<meta name="robots" content="noindex">
<title>Keratoconus poll: presenter screen</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/poll.css?v=3">
</head>
<body class="screen">
<div class="bg-rings" id="bgRings" aria-hidden="true"></div>
<div class="s-app">
  <header class="s-top">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span>Keratoconus<span class="wide-only"> · MENA · audience poll</span></span></div>
    <div class="s-meta">
      <span class="badge test" id="sessBadge" hidden></span>
      <span class="badge" id="roleBadge" hidden>Presenter</span>
      <span class="conn" id="conn"><i></i><span id="connText">Connecting</span></span>
      <button type="button" class="iconbtn" id="btnSettings" aria-haspopup="dialog">Settings</button>
    </div>
  </header>
  <main class="s-main" id="main">
    <section class="view join" id="vjoin">
      <div class="qr-tile" id="qr"></div>
      <div class="join-side">
        <p class="kicker">Scan to answer</p>
        <h1 class="join-title">Two questions.<br>Thirty seconds.</h1>
        <p class="join-url" id="joinUrl"></p>
        <div class="join-row">
          <div>
            <div class="clock" id="clock"><span id="clockRings"></span><span class="clock-num" id="clockNum">30</span></div>
            <span class="clock-cap" id="clockCap">seconds</span>
          </div>
          <div class="tally"><span class="tally-num" id="tally">0</span><span class="tally-lbl" id="tallyLbl">people have answered</span></div>
        </div>
        <p class="join-note">Anonymous · no sign-in · point your phone camera at the code</p>
      </div>
    </section>
  </main>
  <nav class="s-controls" id="controls" aria-label="Poll controls">
    <div class="seg">
      <button type="button" data-view="join">Join</button>
      <button type="button" data-view="q1">Q1</button>
      <button type="button" data-view="q2">Q2</button>
    </div>
    <button type="button" class="btn" id="btnTimer">Start 30 s</button>
    <button type="button" class="btn" id="btnReveal">Reveal</button>
    <button type="button" class="btn wide-only" id="btnFull">Full screen</button>
    <span class="kbd-hint">Clicker or → steps through · ? shows keys</span>
  </nav>
</div>
<div class="panel" id="panel" hidden role="dialog" aria-label="Settings and help"></div>
<div class="blackout" id="blackout" hidden></div>
<script src="config.js?v=3"></script>
<script src="assets/questions.js?v=3"></script>
<script src="assets/answers.js?v=3"></script>
<script src="assets/qrcode.js?v=3"></script>
<script src="assets/common.js?v=3"></script>
<script src="assets/screen.js?v=3"></script>
</body>
</html>
